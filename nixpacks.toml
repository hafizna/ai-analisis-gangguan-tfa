providers = ["...", "node"]

[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.install]
cmds = [
  "...",
  "cd webapp/frontend && npm ci --include=dev"
]

[phases.build]
cmds = [
  "...",
  "cd webapp/frontend && npm run build"
]

[start]
cmd = "uvicorn webapp.api.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120"
