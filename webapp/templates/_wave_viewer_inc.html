{% if analysis.waveform_data %}
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
<script id="waveformData" type="application/json">{{ analysis.waveform_data | tojson }}</script>
<script>
(function() {
    const interactiveShell = document.getElementById('waveInteractiveShell');
    const fallbackBlock = document.getElementById('waveFallbackBlock');
    const fallbackReason = document.getElementById('waveFallbackReason');

    function showWaveFallback(reason, detail) {
        if (interactiveShell) interactiveShell.style.display = 'none';
        if (fallbackBlock) fallbackBlock.style.display = 'block';
        if (fallbackReason) {
            const parts = [];
            if (reason) parts.push(reason);
            if (detail) parts.push(`Detail: ${detail}`);
            fallbackReason.textContent = parts.join(' ');
        }
    }

    try {
        const dataEl = document.getElementById('waveformData');
        if (!dataEl) {
            showWaveFallback('Data waveform interaktif tidak ditemukan. Menampilkan waveform statis.');
            return;
        }
        const wf = JSON.parse(dataEl.textContent || '{}');
        const analogChannelsAll = Array.isArray(wf.channels) ? wf.channels : [];
        const digitalChannelsAll = Array.isArray(wf.digital) ? wf.digital : [];
        if (analogChannelsAll.length === 0 && digitalChannelsAll.length === 0) {
            showWaveFallback('Payload waveform interaktif kosong. Menampilkan waveform statis.');
            return;
        }
        if (typeof Plotly === 'undefined') {
            showWaveFallback('Library plot interaktif gagal dimuat. Menampilkan waveform statis.', 'Objek Plotly tidak tersedia di browser.');
            return;
        }

    const voltageWrap = document.getElementById('waveVoltageWrap');
    const voltagePlot = document.getElementById('waveVoltagePlot');
    const showVoltagePanel = !!(voltageWrap && voltagePlot);
    const currentHvWrap = document.getElementById('waveCurrentHvWrap');
    const currentHvPlot = document.getElementById('waveCurrentHvPlot');
    const currentLvWrap = document.getElementById('waveCurrentLvWrap');
    const currentLvPlot = document.getElementById('waveCurrentLvPlot');
    const currentDiffWrap = document.getElementById('waveCurrentDiffWrap');
    const currentDiffPlot = document.getElementById('waveCurrentDiffPlot');
    const digitalWrap = document.getElementById('waveDigitalWrap');
    const digitalPlot = document.getElementById('waveDigitalPlot');
    const listEl = document.getElementById('waveChannelList');
    const hintEl = document.getElementById('waveHint');
    const badgesEl = document.getElementById('waveMetaBadges');
    const toggleDigital = document.getElementById('toggleDigital');
    const cursorAEl = document.getElementById('cursorAVal');
    const cursorBEl = document.getElementById('cursorBVal');
    const deltaTEl = document.getElementById('cursorDeltaT');
    const deltaYEl = document.getElementById('cursorDeltaY');
    const deltaYLabelEl = document.getElementById('cursorDeltaYLabel');
    const cursor1Btn = document.getElementById('cursor1Btn');
    const cursor2Btn = document.getElementById('cursor2Btn');
    const cursorResetBtn = document.getElementById('cursorResetBtn');
    const peakBtn = document.getElementById('peakFindBtn');
    const peakResultEl = document.getElementById('peakResult');
    const measureCurrentBtn = document.getElementById('measureCurrentBtn');
    const measureVoltageBtn = document.getElementById('measureVoltageBtn');
    const exportPngBtn = document.getElementById('waveExportPngBtn');
    const printBtn = document.getElementById('wavePrintBtn');
    const csvBtn = document.getElementById('waveExportCsvBtn');

    function bindOnce(btn, key, handler) {
        if (!btn || btn.dataset[key]) return;
        btn.dataset[key] = '1';
        btn.addEventListener('click', handler);
    }

    const meta = wf.meta || {};
    const markers = wf.markers || {};
    const tIn = markers.inception_ms || 0;
    const tOut = markers.clearing_ms || 0;
    const plotConfig = {
        displaylogo: false,
        responsive: true,
        editable: false,
        scrollZoom: true,
        displayModeBar: false,
        edits: { shapePosition: false }
    };

    function fmt(val, digits) {
        if (val === undefined || val === null || isNaN(val)) return '-';
        return Number(val).toLocaleString('id-ID', { maximumFractionDigits: digits });
    }

    if (badgesEl) {
        const badges = [
            `Samples: ${fmt(meta.total_samples, 0)}`,
            `Fs: ${fmt(meta.sampling_hz, 1)} Hz`,
            `Analog: ${fmt(meta.analog_total, 0)}`,
            `Digital: ${fmt(meta.digital_total, 0)}`,
            't=0 di inception'
        ];
        if (meta.selected_line_tag) badges.push(`Bay aktif: ${meta.selected_line_tag}`);
        badgesEl.innerHTML = badges.map(b => `<span class=\"wave-badge\">${b}</span>`).join('');
    }

    if (hintEl) {
        const notes = [];
        if (meta.analog_truncated) notes.push('Sebagian kanal analog disembunyikan biar viewer tetap lancar.');
        if (meta.digital_truncated) notes.push('Sebagian kanal digital disembunyikan biar viewer tetap lancar.');
        if (meta.selected_line_tag) notes.push(`Viewer difokuskan ke bay/penghantar ${meta.selected_line_tag}.`);
        notes.push('Tip: pilih Cursor 1 atau Cursor 2 lewat toggle, lalu klik plot untuk menaruh cursor. Δt dan ΔI/ΔV dihitung otomatis. Klik kanal di sidebar untuk isolate/lock. Double-click untuk reset zoom.');
        hintEl.textContent = notes.join('  |  ');
    }

    bindOnce(exportPngBtn, 'boundExport', exportCombinedImage);
    bindOnce(printBtn, 'boundExport', printCombined);
    bindOnce(csvBtn, 'boundExport', exportCSV);

    const voltageChannels = showVoltagePanel ? analogChannelsAll.filter(ch => ch.measurement === 'voltage') : [];
    const currentChannels = analogChannelsAll.filter(ch => ch.measurement === 'current');

    function channelLabel(ch) {
        return ch.display_name || ch.canonical || ch.name || ch.id;
    }

    function bindPlotlyEvent(plotRef, eventName, handler) {
        if (plotRef && typeof plotRef.on === 'function') {
            plotRef.on(eventName, handler);
        }
    }

    function buildState(chs) {
        return chs.map(ch => ({
            x: ch.x.slice(),
            y: ch.y.slice(),
            locked: false
        }));
    }

    const vState = buildState(voltageChannels);
    const currentGroupDefs = [
        {
            key: 'current_hv',
            title: 'Arus HV',
            groups: ['current_hv'],
            wrap: currentHvWrap,
            plot: currentHvPlot
        },
        {
            key: 'current_lv',
            title: 'Arus LV',
            groups: ['current_lv', 'current_tv'],
            wrap: currentLvWrap,
            plot: currentLvPlot
        },
        {
            key: 'current_diff',
            title: 'Arus Diferensial & Bias',
            groups: ['current_diff', 'current_restraint'],
            wrap: currentDiffWrap,
            plot: currentDiffPlot
        }
    ];
    const currentGroupMap = Object.fromEntries(currentGroupDefs.map(def => [def.key, def]));
    const currentChannelSets = Object.fromEntries(
        currentGroupDefs.map(def => [
            def.key,
            currentChannels.filter(ch => def.groups.includes(ch.group || 'current_other'))
        ])
    );
    const currentStates = Object.fromEntries(
        currentGroupDefs.map(def => [def.key, buildState(currentChannelSets[def.key])])
    );
    const genericCurrentChannels = currentChannels.filter(ch => (ch.group || 'current_other') === 'current_other');
    const hasStructuredCurrent = currentChannels.some(ch => (ch.group || '') !== 'current_other');
    if (!hasStructuredCurrent && genericCurrentChannels.length) {
        currentChannelSets.current_lv = genericCurrentChannels;
        currentStates.current_lv = buildState(genericCurrentChannels);
    } else if (genericCurrentChannels.length) {
        // Keep ambiguous current channels visible instead of hiding them entirely.
        // This is useful for local/remote or vendor-specific labels that do not map
        // cleanly into HV/LV/DIFF groups but still carry valid waveform information.
        currentChannelSets.current_lv = [...currentChannelSets.current_lv, ...genericCurrentChannels];
        currentStates.current_lv = buildState(currentChannelSets.current_lv);
    }

    function buildTraces(chs) {
        return chs.map(ch => {
            const label = channelLabel(ch);
            return {
            x: ch.x,
            y: ch.y,
            name: label + (ch.unit ? ` (${ch.unit})` : ''),
            line: { color: ch.color || '#94a3b8', width: 1.4, dash: ch.line_dash || 'solid' },
            mode: 'lines',
            hovertemplate: `${label}<br>%{y:.3f} ${ch.unit || ''}<br>%{x:.2f} ms<extra></extra>`
        };
        });
    }

    const markerShapes = [];
    if (tOut > tIn) {
        markerShapes.push({
            type: 'line', x0: tIn, x1: tIn, y0: 0, y1: 1,
            xref: 'x', yref: 'paper',
            line: { color: '#f59e0b', width: 1, dash: 'dot' }
        });
        markerShapes.push({
            type: 'line', x0: tOut, x1: tOut, y0: 0, y1: 1,
            xref: 'x', yref: 'paper',
            line: { color: '#ef4444', width: 1, dash: 'dot' }
        });
        markerShapes.push({
            type: 'rect', x0: tIn, x1: tOut, y0: 0, y1: 1,
            xref: 'x', yref: 'paper',
            fillcolor: '#f59e0b', opacity: 0.06, line: { width: 0 }
        });
    }

    const axisBase = {
        color: '#94a3b8',
        gridcolor: 'rgba(148,163,184,0.18)',
        linecolor: 'rgba(148,163,184,0.25)',
        zerolinecolor: 'rgba(148,163,184,0.25)',
        tickfont: { size: 10, color: '#64748b' },
        title: { font: { size: 11, color: '#94a3b8' } }
    };

    function renderAnalogPlot(plotRef, channels, yTitle) {
        if (!plotRef || !channels.length) return false;
        Plotly.newPlot(plotRef, buildTraces(channels), {
            margin: { l: 54, r: 20, t: 28, b: 30 },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor:  'rgba(0,0,0,0)',
            xaxis: { ...axisBase, title: { text: 'Waktu (ms)', font: { size: 11, color: '#94a3b8' } } },
            yaxis: { ...axisBase, title: { text: yTitle, font: { size: 11, color: '#94a3b8' } }, tickformat: '.3g' },
            legend: { orientation: 'h', x: 0, y: 1.18, font: { size: 10, color: '#94a3b8' } },
            shapes: markerShapes,
            dragmode: 'pan',
            hovermode: 'x unified',
            editable: false
        }, plotConfig);
        return true;
    }

    const hasVoltagePlot = showVoltagePanel ? renderAnalogPlot(voltagePlot, voltageChannels, 'Tegangan (kV)') : false;
    if (voltageWrap) {
        voltageWrap.style.display = hasVoltagePlot ? 'flex' : 'none';
    }

    currentGroupDefs.forEach(def => {
        const hasPlot = renderAnalogPlot(def.plot, currentChannelSets[def.key], 'Arus (A)');
        if (def.wrap) {
            def.wrap.style.display = hasPlot ? 'flex' : 'none';
        }
        def.hasPlot = hasPlot;
    });

    // For the LV panel: if all channels are "current_other" (i.e. line fault — no HV/LV winding info),
    // relabel the panel title from "Arus LV / TV" to just "Arus" to avoid misleading users.
    const lvDef = currentGroupDefs.find(d => d.key === 'current_lv');
    if (lvDef && lvDef.hasPlot && lvDef.wrap) {
        const lvChs = currentChannelSets['current_lv'] || [];
        const hasLv = lvChs.some(ch => ch.group === 'current_lv');
        const hasTv = lvChs.some(ch => ch.group === 'current_tv');
        const hasGeneric = lvChs.some(ch => (ch.group || 'current_other') === 'current_other');
        const titleEl = lvDef.wrap.querySelector('.wave-subplot-title');
        if (hasGeneric && !hasLv && !hasTv) lvDef.title = 'Arus';
        else if (hasLv && hasTv) lvDef.title = 'Arus LV / TV';
        else if (hasTv) lvDef.title = 'Arus TV';
        else lvDef.title = 'Arus LV';
        if (titleEl) titleEl.textContent = lvDef.title;
    }

    const digitalCount = (wf.digital || []).length;
    const digitalRowGap = digitalCount <= 4 ? 2.3 : (digitalCount <= 8 ? 2.0 : (digitalCount <= 12 ? 1.8 : 1.6));
    const digitalAmplitude = 0.9;
    const digitalHeight = Math.max(220, Math.min(760, 90 + digitalCount * 34));
    const digitalLabelLimit = 30;
    const digitalTickText = (wf.digital || []).map(ch => {
        const name = (ch.name || ch.id || '').trim();
        return name.length > digitalLabelLimit ? `${name.slice(0, digitalLabelLimit - 1)}…` : name;
    });
    const digitalMaxLabelLen = digitalTickText.reduce((maxLen, label) => Math.max(maxLen, label.length), 0);
    const digitalLeftMargin = Math.min(260, Math.max(130, 78 + digitalMaxLabelLen * 5));
    const digitalTraces = (wf.digital || []).map((ch, idx) => {
        const offset = (digitalCount - 1 - idx) * digitalRowGap;
        return {
            x: ch.x,
            y: ch.y.map(v => v * digitalAmplitude + offset),
            name: ch.name || ch.id,
            mode: 'lines',
            line: { color: '#60a5fa', width: 1.2, shape: 'hv' },
            hovertemplate: `${ch.name || ch.id}<br>%{x:.2f} ms — state %{customdata}<extra></extra>`,
            customdata: ch.y
        };
    });

    if (digitalTraces.length > 0) {
        const tickVals = digitalTraces.map((_, idx) => (digitalCount - 1 - idx) * digitalRowGap + digitalAmplitude * 0.5);
        const digitalYMax = Math.max(1.2, (digitalCount - 1) * digitalRowGap + 1.15);
        if (digitalPlot) {
            digitalPlot.style.minHeight = `${digitalHeight}px`;
            digitalPlot.style.height = `${digitalHeight}px`;
        }
        Plotly.newPlot(digitalPlot, digitalTraces, {
            height: digitalHeight,
            margin: { l: digitalLeftMargin, r: 20, t: 10, b: 36 },
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor:  'rgba(0,0,0,0)',
            xaxis: { ...axisBase, title: { text: 'Waktu (ms dari trigger)', font: { size: 11, color: '#94a3b8' } } },
            yaxis: {
                tickvals: tickVals,
                ticktext: digitalTickText,
                range: [-0.35, digitalYMax],
                automargin: true,
                ...axisBase,
                tickfont: { size: digitalCount > 12 ? 8 : 9, color: '#94a3b8' }
            },
            showlegend: false,
            shapes: markerShapes,
            dragmode: 'pan',
            editable: false
        }, plotConfig);
    } else if (digitalPlot) {
        digitalPlot.style.display = 'none';
        digitalPlot.style.height = '';
        digitalPlot.style.minHeight = '';
        if (toggleDigital) toggleDigital.checked = false;
    }
    if (digitalWrap) {
        digitalWrap.style.display = digitalTraces.length > 0 ? 'flex' : 'none';
    }

    const currentDefsWithPlots = () => currentGroupDefs.filter(def => def.hasPlot);

    function getCurrentPlotRef(key) {
        return currentGroupMap[key]?.plot || null;
    }

    function getCurrentStateRef(key) {
        return currentStates[key] || [];
    }

    function isPlotVisible(plotRef) {
        return !!(plotRef && plotRef.offsetParent !== null && plotRef.style.display !== 'none');
    }

    function visiblePlotRefs() {
        return [...(showVoltagePanel ? [voltagePlot] : []), ...currentDefsWithPlots().map(def => def.plot), digitalPlot]
            .filter(isPlotVisible);
    }

    // Auto-zoom to fault window on initial render
    // Show 2 pre-fault cycles before inception and adequate post-clearing context
    if (tOut > tIn) {
        setTimeout(function () {
            const faultDur = tOut - tIn;
            const pad = Math.max(80, faultDur * 1.5);
            const range = [tIn - pad, tOut + pad];
            if (showVoltagePanel && isPlotVisible(voltagePlot))
                Plotly.relayout(voltagePlot, { 'xaxis.range': range });
            currentDefsWithPlots().forEach(def => {
                if (isPlotVisible(def.plot)) {
                    Plotly.relayout(def.plot, { 'xaxis.range': range });
                }
            });
            if (isPlotVisible(digitalPlot))
                Plotly.relayout(digitalPlot,  { 'xaxis.range': range });
            if (showVoltagePanel) autoScaleY(voltagePlot, vState);
            currentDefsWithPlots().forEach(def => autoScaleY(def.plot, getCurrentStateRef(def.key)));
        }, 350);
    }

    if (listEl) {
        const renderChannelRows = (rows, plotName) => rows.map(({ ch, idx }) => {
            const label = channelLabel(ch);
            const stats = `min ${fmt(ch.min, 2)} | max ${fmt(ch.max, 2)} | rms ${fmt(ch.rms, 2)}`;
            return `
            <label class=\"wave-channel\" data-plot=\"${plotName}\" data-trace=\"${idx}\">
                <input type=\"checkbox\" checked>
                <span class=\"wave-dot\" style=\"background:${ch.color || '#94a3b8'}\"></span>
                <span class=\"wave-meta\">
                    <span class=\"wave-name\">${label}</span>
                    <span class=\"wave-stats\">${stats}</span>
                </span>
                <span class=\"wave-tools\">
                    <button class=\"wave-tool-btn\" data-action=\"lock\">Lock</button>
                </span>
            </label>`;
        }).join('');
        const iList = currentGroupDefs.map(def => {
            const rows = currentChannelSets[def.key].map((ch, idx) => ({ ch, idx }));
            if (!rows.length) return '';
            return `
            <div class=\"wave-group-title\">${def.title}</div>
            ${renderChannelRows(rows, def.key)}`;
        }).join('');
        const vList = showVoltagePanel ? `
            <div class=\"wave-group-title\">Tegangan</div>
            ${renderChannelRows(voltageChannels.map((ch, idx) => ({ ch, idx })), 'voltage') || '<div style=\"font-size:11px;color:var(--text-muted);padding:6px;\">Kanal tegangan tidak tersedia</div>'}
        ` : '';
        listEl.innerHTML = `
            ${vList}
            ${iList || '<div class=\"wave-group-title\">Current</div><div style=\"font-size:11px;color:var(--text-muted);padding:6px;\">Kanal arus tidak tersedia</div>'}
        `;
    }

    function getPlotRef(name) {
        if (name === 'voltage') return voltagePlot;
        return getCurrentPlotRef(name);
    }

    function getStateRef(name) {
        if (name === 'voltage') return vState;
        return getCurrentStateRef(name);
    }

    if (listEl) {
        listEl.addEventListener('change', (ev) => {
            const target = ev.target;
            if (!target || target.tagName !== 'INPUT') return;
            const row = target.closest('.wave-channel');
            if (!row) return;
            const idx = parseInt(row.getAttribute('data-trace'), 10);
            const plotName = row.getAttribute('data-plot');
            const plotRef = getPlotRef(plotName);
            const visible = target.checked ? true : 'legendonly';
            Plotly.restyle(plotRef, { visible: visible }, [idx]);
        });
        listEl.addEventListener('click', (ev) => {
            const btn = ev.target.closest('.wave-tool-btn');
            if (!btn) return;
            ev.preventDefault();
            const row = btn.closest('.wave-channel');
            if (!row) return;
            const idx = parseInt(row.getAttribute('data-trace'), 10);
            const plotName = row.getAttribute('data-plot');
            const stateRef = getStateRef(plotName);
            const plotRef = getPlotRef(plotName);
            const action = btn.getAttribute('data-action');
            if (action === 'lock') {
                stateRef[idx].locked = !stateRef[idx].locked;
                btn.classList.toggle('active', stateRef[idx].locked);
                applyLockedScale(plotRef, stateRef);
            }
        });
    }

    if (toggleDigital && digitalPlot) {
        toggleDigital.addEventListener('change', () => {
            if (digitalWrap) {
                digitalWrap.style.display = toggleDigital.checked ? 'flex' : 'none';
            } else {
                digitalPlot.style.display = toggleDigital.checked ? 'block' : 'none';
            }
        });
    }

    const resetBtn = document.getElementById('waveResetBtn');
    if (resetBtn) {
        resetBtn.addEventListener('click', () => {
            if (voltagePlot) Plotly.relayout(voltagePlot, { 'xaxis.autorange': true, 'yaxis.autorange': true });
            currentDefsWithPlots().forEach(def => {
                if (def.plot) Plotly.relayout(def.plot, { 'xaxis.autorange': true, 'yaxis.autorange': true });
            });
            if (digitalPlot) Plotly.relayout(digitalPlot, { 'xaxis.autorange': true });
        });
    }

    const focusBtn = document.getElementById('waveFocusBtn');
    if (focusBtn) {
        focusBtn.addEventListener('click', () => {
            // Show 2 pre-fault cycles before inception + 2 post-clearing cycles for context
            const faultDur = (tOut > tIn) ? (tOut - tIn) : 80;
            const prePad  = Math.max(60, faultDur * 1.5);   // at least 60 ms pre-fault
            const postPad = Math.max(60, faultDur * 1.5);   // at least 60 ms post-clearing
            const rangeStart = (tOut > tIn) ? tIn - prePad : tIn - prePad;
            const rangeEnd   = (tOut > tIn) ? tOut + postPad : tIn + postPad;
            const range = [rangeStart, rangeEnd];
            if (voltagePlot) Plotly.relayout(voltagePlot, { 'xaxis.range': range });
            currentDefsWithPlots().forEach(def => {
                if (def.plot) Plotly.relayout(def.plot, { 'xaxis.range': range });
            });
            if (digitalPlot) Plotly.relayout(digitalPlot, { 'xaxis.range': range });
            autoScaleY(voltagePlot, vState);
            currentDefsWithPlots().forEach(def => autoScaleY(def.plot, getCurrentStateRef(def.key)));
        });
    }

    let syncing = false;
    function syncX(sourcePlot, targetPlot, ev) {
        if (!targetPlot || syncing) return;
        // Use !== undefined (not truthiness) — range[0] can be 0 or negative ms
        if (ev['xaxis.range[0]'] !== undefined && ev['xaxis.range[1]'] !== undefined) {
            syncing = true;
            Plotly.relayout(targetPlot, { 'xaxis.range': [ev['xaxis.range[0]'], ev['xaxis.range[1]']] }).then(() => { syncing = false; });
        } else if (ev['xaxis.autorange']) {
            syncing = true;
            Plotly.relayout(targetPlot, { 'xaxis.autorange': true }).then(() => { syncing = false; });
        }
    }

    function anyLocked(stateRef) {
        return stateRef.some(s => s.locked);
    }

    function autoScaleY(plotRef, stateRef) {
        if (!plotRef || !plotRef.layout || anyLocked(stateRef)) return;
        const range = plotRef.layout.xaxis && plotRef.layout.xaxis.range
            ? plotRef.layout.xaxis.range
            : null;
        if (!range) {
            Plotly.relayout(plotRef, { 'yaxis.autorange': true });
            return;
        }
        const minX = range[0];
        const maxX = range[1];
        let minV = Infinity;
        let maxV = -Infinity;
        plotRef.data.forEach((t, idx) => {
            if (t.visible === 'legendonly') return;
            const st = stateRef[idx];
            if (!st) return;
            const xs = st.x;
            const ys = st.y;
            if (!xs.length) return;
            let i0 = nearestIndex(xs, minX);
            let i1 = nearestIndex(xs, maxX);
            if (i1 < i0) [i0, i1] = [i1, i0];
            for (let i = i0; i <= i1; i++) {
                const v = ys[i];
                if (v < minV) minV = v;
                if (v > maxV) maxV = v;
            }
        });
        if (!isFinite(minV) || !isFinite(maxV)) return;
        const pad = (maxV - minV) * 0.08 || 1;
        Plotly.relayout(plotRef, { 'yaxis.range': [minV - pad, maxV + pad] });
    }

    function applyLockedScale(plotRef, stateRef) {
        if (!plotRef) return;
        const locked = stateRef.filter(s => s.locked);
        if (locked.length === 0) {
            Plotly.relayout(plotRef, { 'yaxis.autorange': true });
            return;
        }
        let minV = Infinity;
        let maxV = -Infinity;
        locked.forEach(st => {
            if (!st.y.length) return;
            const localMin = Math.min(...st.y);
            const localMax = Math.max(...st.y);
            minV = Math.min(minV, localMin);
            maxV = Math.max(maxV, localMax);
        });
        if (!isFinite(minV) || !isFinite(maxV)) return;
        const pad = (maxV - minV) * 0.08 || 1;
        Plotly.relayout(plotRef, { 'yaxis.range': [minV - pad, maxV + pad] });
    }

    function nearestIndex(arr, x) {
        let lo = 0, hi = arr.length - 1;
        while (lo < hi) {
            const mid = Math.floor((lo + hi) / 2);
            if (arr[mid] < x) lo = mid + 1;
            else hi = mid;
        }
        return lo;
    }

    function syncToAll(sourcePlot, ev) {
        if (syncing) return;
        const targets = visiblePlotRefs().filter(targetPlot => targetPlot !== sourcePlot);
        if (!targets.length) return;
        let update = null;
        if (ev['xaxis.range[0]'] !== undefined && ev['xaxis.range[1]'] !== undefined) {
            update = { 'xaxis.range': [ev['xaxis.range[0]'], ev['xaxis.range[1]']] };
        } else if (ev['xaxis.autorange']) {
            update = { 'xaxis.autorange': true };
        }
        if (!update) return;
        syncing = true;
        Promise.all(targets.map(targetPlot => Plotly.relayout(targetPlot, update)))
            .finally(() => { syncing = false; });
    }

    if (voltagePlot) {
        bindPlotlyEvent(voltagePlot, 'plotly_relayout', (ev) => {
            syncToAll(voltagePlot, ev);
            if (ev['xaxis.range[0]'] !== undefined || ev['xaxis.autorange']) autoScaleY(voltagePlot, vState);
        });
    }
    currentGroupDefs.forEach(def => {
        if (!def.plot || !def.hasPlot) return;
        bindPlotlyEvent(def.plot, 'plotly_relayout', (ev) => {
            syncToAll(def.plot, ev);
            if (ev['xaxis.range[0]'] !== undefined || ev['xaxis.autorange']) {
                autoScaleY(def.plot, getCurrentStateRef(def.key));
            }
        });
    });
    if (digitalPlot) {
        bindPlotlyEvent(digitalPlot, 'plotly_relayout', (ev) => {
            syncToAll(digitalPlot, ev);
        });
    }

    let activeMeasure = 'current';
    let activeCurrentGroupKey = currentDefsWithPlots()[0]?.key || 'current_hv';
    function setMeasure(mode, currentKey) {
        activeMeasure = mode;
        if (mode === 'current' && currentKey) {
            activeCurrentGroupKey = currentKey;
        }
        if (mode === 'current' && !currentDefsWithPlots().some(def => def.key === activeCurrentGroupKey)) {
            activeCurrentGroupKey = currentDefsWithPlots()[0]?.key || 'current_hv';
        }
        if (measureCurrentBtn) measureCurrentBtn.classList.toggle('active', mode === 'current');
        if (measureVoltageBtn) measureVoltageBtn.classList.toggle('active', mode === 'voltage');
        updateCursorReadout();
    }
    if (measureCurrentBtn) measureCurrentBtn.addEventListener('click', () => setMeasure('current'));
    if (measureVoltageBtn) measureVoltageBtn.addEventListener('click', () => setMeasure('voltage'));

    function getActivePlot() {
        return activeMeasure === 'voltage' ? voltagePlot : getCurrentPlotRef(activeCurrentGroupKey);
    }
    function getActiveState() {
        return activeMeasure === 'voltage' ? vState : getCurrentStateRef(activeCurrentGroupKey);
    }

    function getActiveTraceIndex(plotRef) {
        if (!plotRef || !plotRef.data) return 0;
        const visible = plotRef.data
            .map((t, i) => ({ t, i }))
            .filter(x => x.t.visible !== 'legendonly');
        return visible.length ? visible[0].i : 0;
    }

    const cursor = { c1: null, c2: null, active: 1 };

    function setActiveCursor(slot) {
        cursor.active = slot === 2 ? 2 : 1;
        if (cursor1Btn) {
            cursor1Btn.classList.toggle('active', cursor.active === 1);
            cursor1Btn.setAttribute('aria-pressed', cursor.active === 1 ? 'true' : 'false');
        }
        if (cursor2Btn) {
            cursor2Btn.classList.toggle('active', cursor.active === 2);
            cursor2Btn.setAttribute('aria-pressed', cursor.active === 2 ? 'true' : 'false');
        }
    }

    function updateCursorReadout() {
        if (!cursorAEl || !cursorBEl || !deltaTEl || !deltaYEl) return;
        const plotRef = getActivePlot();
        const stateRef = getActiveState();
        const idx = getActiveTraceIndex(plotRef);
        const st = stateRef[idx];
        if (!st) return;
        const xArr = st.x;
        const yArr = st.y;
        const unitSuffix = st.unit ? ` (${st.unit})` : '';

        function valAt(x) {
            if (x === null || xArr.length === 0) return null;
            const i = nearestIndex(xArr, x);
            return { x: xArr[i], y: yArr[i] };
        }

        const a = valAt(cursor.c1);
        const b = valAt(cursor.c2);
        cursorAEl.textContent = a ? `${fmt(a.x, 2)} ms | ${fmt(a.y, 3)}${unitSuffix}` : '-';
        cursorBEl.textContent = b ? `${fmt(b.x, 2)} ms | ${fmt(b.y, 3)}${unitSuffix}` : '-';
        if (deltaYLabelEl) {
            deltaYLabelEl.textContent = activeMeasure === 'voltage' ? `ΔV${unitSuffix}:` : `ΔI${unitSuffix}:`;
        }
        if (a && b) {
            deltaTEl.textContent = `${fmt(Math.abs(b.x - a.x), 3)} ms`;
            deltaYEl.textContent = `${fmt(Math.abs(b.y - a.y), 3)}${unitSuffix}`;
        } else {
            deltaTEl.textContent = '-';
            deltaYEl.textContent = '-';
        }
    }

    function drawCursors() {
        const shapes = markerShapes.slice();
        if (cursor.c1 !== null) {
            shapes.push({ type: 'line', x0: cursor.c1, x1: cursor.c1, y0: 0, y1: 1, xref: 'x', yref: 'paper', line: { color: '#22c55e', width: 1 } });
        }
        if (cursor.c2 !== null) {
            shapes.push({ type: 'line', x0: cursor.c2, x1: cursor.c2, y0: 0, y1: 1, xref: 'x', yref: 'paper', line: { color: '#e11d48', width: 1 } });
        }
        if (voltagePlot) Plotly.relayout(voltagePlot, { shapes });
        currentDefsWithPlots().forEach(def => {
            if (def.plot) Plotly.relayout(def.plot, { shapes });
        });
        if (digitalPlot) Plotly.relayout(digitalPlot, { shapes });
        setActiveCursor(cursor.active);
        updateCursorReadout();
    }

    // Cursor placement: track last hovered x via plotly_hover, then place on div click.
    // This works anywhere on the plot area (not just exactly on a data point).
    const lastHoveredX = { voltage: null, current_hv: null, current_lv: null, current_diff: null };

    function _placeCursor(plotName, cursorSlot) {
        const x = lastHoveredX[plotName];
        if (x === null || x === undefined) return;
        if (cursorSlot === 2) cursor.c2 = x; else cursor.c1 = x;
        setMeasure(plotName === 'voltage' ? 'voltage' : 'current', plotName);
        drawCursors();
    }

    if (cursor1Btn) cursor1Btn.addEventListener('click', () => {
        setActiveCursor(1);
        updateCursorReadout();
    });
    if (cursor2Btn) cursor2Btn.addEventListener('click', () => {
        setActiveCursor(2);
        updateCursorReadout();
    });

    if (voltagePlot) {
        bindPlotlyEvent(voltagePlot, 'plotly_hover', ev => {
            if (ev.points && ev.points.length) lastHoveredX.voltage = ev.points[0].x;
        });
        voltagePlot.addEventListener('click', e => _placeCursor('voltage', e.shiftKey ? 2 : cursor.active));
    }
    currentGroupDefs.forEach(def => {
        if (!def.plot || !def.hasPlot) return;
        bindPlotlyEvent(def.plot, 'plotly_hover', ev => {
            if (ev.points && ev.points.length) {
                lastHoveredX[def.key] = ev.points[0].x;
                activeCurrentGroupKey = def.key;
            }
        });
        def.plot.addEventListener('click', e => _placeCursor(def.key, e.shiftKey ? 2 : cursor.active));
    });

    if (cursorResetBtn) {
        cursorResetBtn.addEventListener('click', () => {
            cursor.c1 = null;
            cursor.c2 = null;
            drawCursors();
        });
    }

    if (peakBtn) {
        peakBtn.addEventListener('click', () => {
            const plotRef = getActivePlot();
            const stateRef = getActiveState();
            if (!plotRef || !plotRef.layout || !stateRef.length) return;
            const idx = getActiveTraceIndex(plotRef);
            const st = stateRef[idx];
            const xArr = st.x;
            const yArr = st.y;
            if (!xArr.length) return;
            const range = plotRef.layout.xaxis.range || [xArr[0], xArr[xArr.length - 1]];
            let i0 = Math.max(0, nearestIndex(xArr, range[0]));
            let i1 = Math.min(xArr.length - 1, nearestIndex(xArr, range[1]));
            if (i1 < i0) [i0, i1] = [i1, i0];
            let maxIdx = i0;
            let maxAbs = Math.abs(yArr[i0]);
            for (let i = i0; i <= i1; i++) {
                const v = Math.abs(yArr[i]);
                if (v > maxAbs) { maxAbs = v; maxIdx = i; }
            }
            const peakX = xArr[maxIdx];
            const peakY = yArr[maxIdx];
            if (peakResultEl) {
                peakResultEl.textContent = `Peak: ${fmt(peakY, 3)} @ ${fmt(peakX, 2)} ms`;
            }
            if (cursor.active === 2) cursor.c2 = peakX;
            else cursor.c1 = peakX;
            drawCursors();
        });
    }

    setActiveCursor(cursor.active);
    setMeasure(currentDefsWithPlots().length || !showVoltagePanel ? 'current' : 'voltage');

    function _getPlotSize(plotRef) {
        if (!plotRef) return { width: 1200, height: 380 };
        const rect = plotRef.getBoundingClientRect();
        return {
            width:  Math.max(900,  Math.floor(rect.width)),
            height: Math.max(280,  Math.floor(rect.height))
        };
    }

    function _setBtnState(btn, loading) {
        if (!btn) return;
        if (loading) {
            btn._origText = btn.textContent;
            btn.textContent = '⏳ Memuat...';
            btn.disabled = true;
            btn.style.opacity = '0.7';
        } else {
            btn.textContent = btn._origText || btn.textContent;
            btn.disabled = false;
            btn.style.opacity = '';
        }
    }

    function _loadImg(src) {
        return new Promise((res, rej) => {
            const img = new Image();
            img.onload = () => res(img);
            img.onerror = rej;
            img.src = src;
        });
    }

    function _visiblePlots() {
        return visiblePlotRefs();
    }

    function getExportAnalogChannels() {
        const analog = [];
        if (showVoltagePanel) analog.push(...voltageChannels);
        currentGroupDefs.forEach(def => {
            analog.push(...(currentChannelSets[def.key] || []));
        });
        return analog;
    }

    // Get Plotly PNG data URLs for all visible plots — each plot uses its own dimensions
    async function _getPlotImgUrls(scale) {
        scale = scale || 1.5;
        const plots = _visiblePlots();
        if (!plots.length) return [];
        // Measure each plot individually (digital chart height ≠ voltage/current height)
        return Promise.all(plots.map(p => {
            const size = _getPlotSize(p);
            return Plotly.toImage(p, { format: 'png', width: size.width, height: size.height, scale });
        }));
    }

    // Wrap canvas.toBlob in a Promise so errors are caught by the outer try-catch
    function _canvasToBlob(canvas, type) {
        return new Promise((resolve, reject) => {
            if (canvas.toBlob) {
                canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob returned null')), type || 'image/png');
            } else {
                // Synchronous fallback for older browsers
                try {
                    const dataUrl = canvas.toDataURL(type || 'image/png');
                    // Convert data URL to Blob
                    const arr = dataUrl.split(','), mime = arr[0].match(/:(.*?);/)[1];
                    const bstr = atob(arr[1]);
                    let n = bstr.length;
                    const u8 = new Uint8Array(n);
                    while (n--) u8[n] = bstr.charCodeAt(n);
                    resolve(new Blob([u8], { type: mime }));
                } catch (e) { reject(e); }
            }
        });
    }

    // Export PNG — combined single image of all visible plots with header
    async function exportCombinedImage() {
        _setBtnState(exportPngBtn, true);
        const subtitle = document.querySelector('.topbar-sub')?.textContent?.trim() || 'comtrade';
        const safeName = subtitle.replace(/[^a-zA-Z0-9_\-\.]/g, '_').slice(0, 60);
        try {
            const imgUrls = await _getPlotImgUrls(1.5);
            if (!imgUrls.length) { alert('Belum ada plot untuk diekspor.'); return; }

            const imgs = await Promise.all(imgUrls.map(_loadImg));
            const W = Math.max(...imgs.map(i => i.width));
            const HDR = 72;
            const H = imgs.reduce((s, i) => s + i.height, 0) + HDR;

            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');

            // White background + header
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 24px Arial, sans-serif';
            ctx.fillText(subtitle, 18, 30);
            ctx.fillStyle = '#64748b';
            ctx.font = '15px Arial, sans-serif';
            ctx.fillText('TFA — Rekaman Gelombang COMTRADE  |  ' + new Date().toLocaleString('id-ID'), 18, 54);
            ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, HDR - 2); ctx.lineTo(W, HDR - 2); ctx.stroke();

            // Stack plots vertically, each centred to canvas width
            let y = HDR;
            imgs.forEach(img => {
                ctx.drawImage(img, Math.floor((W - img.width) / 2), y);
                y += img.height;
            });

            // Await toBlob so any error is caught below
            const blob = await _canvasToBlob(canvas, 'image/png');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `waveform_${safeName}.png`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 8000);

        } catch (err) {
            console.error('Export PNG error:', err);
            // Fallback: download each plot separately via Plotly.downloadImage
            const plots = _visiblePlots();
            if (plots.length) {
                for (let i = 0; i < plots.length; i++) {
                    const size = _getPlotSize(plots[i]);
                    try {
                        await Plotly.downloadImage(plots[i], {
                            format: 'png',
                            width: size.width,
                            height: size.height,
                            filename: `waveform_${safeName}_plot${i + 1}`
                        });
                    } catch (e2) {
                        console.error('Plotly.downloadImage fallback failed:', e2);
                    }
                }
            } else {
                alert('Gagal mengekspor PNG: ' + (err.message || err));
            }
        } finally {
            _setBtnState(exportPngBtn, false);
        }
    }

    // Print / Save PDF — injects static images into a print-only div, then window.print()
    // No popup window needed — avoids browser popup blockers entirely
    async function printCombined() {
        _setBtnState(printBtn, true);
        // Remove any leftover print div
        const oldDiv = document.getElementById('_tfaPrintDiv');
        if (oldDiv) oldDiv.remove();

        try {
            // Use scale 1.5 — same as PNG export; scale 2 can exceed browser memory
            const imgUrls = await _getPlotImgUrls(1.5);
            if (!imgUrls.length) { alert('Belum ada plot untuk dicetak.'); return; }

            const subtitle = document.querySelector('.topbar-sub')?.textContent?.trim() || '';
            const now = new Date().toLocaleString('id-ID');

            // Wait for all images to load before injecting into print div
            const imgs = await Promise.all(imgUrls.map(_loadImg));

            // Build hidden print-only container (appended to body, NOT inside .main-wrap)
            const div = document.createElement('div');
            div.id = '_tfaPrintDiv';
            div.innerHTML = `
                <div style="margin-bottom:14px;">
                    <div style="font-size:16px;font-weight:700;color:#0f172a;margin-bottom:3px;">
                        Rekaman Gelombang COMTRADE
                    </div>
                    <div style="font-size:12px;color:#64748b;">${subtitle} — ${now}</div>
                </div>
            `;
            // Use already-loaded Image elements (guarantees paint before print)
            imgs.forEach(img => {
                img.style.width = '100%';
                img.style.display = 'block';
                img.style.marginBottom = '8px';
                img.style.pageBreakInside = 'avoid';
                div.appendChild(img);
            });
            document.body.appendChild(div);

            // Flush layout then open print dialog
            await new Promise(r => setTimeout(r, 300));
            window.print();

            // Clean up after print dialog closes (3s grace period)
            setTimeout(() => { try { div.remove(); } catch(e) {} }, 3000);
        } catch (err) {
            console.error('Print error:', err);
            alert('Gagal menyiapkan cetak: ' + (err.message || err));
        } finally {
            _setBtnState(printBtn, false);
        }
    }

    // CSV export — download waveform time-series as a spreadsheet-ready CSV
    function exportCSV() {
        const analogChs = getExportAnalogChannels();
        if (!analogChs.length) {
            alert('Belum ada data waveform untuk diekspor.'); return;
        }
        const digitalChs = wf.digital || [];
        const tArr = analogChs[0].x;
        const csvEscape = (value) => {
            const text = value === undefined || value === null ? '' : String(value);
            return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        };

        const headers = ['t_ms', ...analogChs.map(c => channelLabel(c) + (c.unit ? ` (${c.unit})` : '')),
                         ...digitalChs.map(c => (c.name || c.id) + ' (digital)')];

        // Build rows (nearest-sample interpolation for digital channels whose x may differ)
        const rows = tArr.map((t, i) => {
            const aVals = analogChs.map(c => c.y[i] !== undefined ? c.y[i].toFixed(4) : '');
            const dVals = digitalChs.map(c => {
                const di = Math.min(i, c.y.length - 1);
                return c.y[di] !== undefined ? c.y[di] : '';
            });
            return [t.toFixed(4), ...aVals, ...dVals].map(csvEscape).join(',');
        });

        const csv = [headers.map(csvEscape).join(','), ...rows].join('\r\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const subtitle = document.querySelector('.topbar-sub')?.textContent || 'comtrade';
        const safeName = subtitle.replace(/[^a-zA-Z0-9_\-\.]/g, '_').slice(0, 50);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `waveform_${safeName}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 8000);
    }
    } catch (err) {
        console.error('Waveform viewer init failed', err);
        showWaveFallback(
            'Viewer interaktif gagal dimuat — menampilkan waveform statis dari server.',
            err && err.message ? err.message : String(err || 'Unknown error')
        );
    }
})();
</script>
